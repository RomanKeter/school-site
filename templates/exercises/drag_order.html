{% load learn %}<ul class="order-list">{% for it in payload.items|shuffled %}
<li data-id="{{ it.id }}"><span aria-hidden="true" style="color:var(--muted)">{% include "partials/icon.html" with n="grip" %}</span><span class="grow">{{ it.text }}</span><button type="button" data-move="up" aria-label="Выше">{% include "partials/icon.html" with n="chevron-up" %}</button><button type="button" data-move="down" aria-label="Ниже">{% include "partials/icon.html" with n="chevron-down" %}</button></li>{% endfor %}</ul>
