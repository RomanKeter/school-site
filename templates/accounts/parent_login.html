{% extends "base.html" %}
{% block bodyclass %}parent{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:40px auto">
<h1>Вход для родителя</h1>
<form method="post" class="form">{% csrf_token %}
  {% if form.non_field_errors %}<ul class="errorlist">{% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
  <p><label>Логин<br><input name="username" autocomplete="username" required></label></p>
  <p><label>Пароль<br><input type="password" name="password" autocomplete="current-password" required></label></p>
  <p><label><input type="checkbox" name="remember" checked> Запомнить меня (14 дней)</label></p>
  <button class="btn">Войти</button>
</form>
<p class="muted"><a href="{% url 'child_start' %}">← Вход ребёнка</a></p>
</div>
{% endblock %}
