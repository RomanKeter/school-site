# /etc/nginx/sites-available/school-site — отдельный server-блок; существующий Telegram-бот не затрагивается
server {
    listen 80;
    server_name school.example.by;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name school.example.by;
    # сертификат выдаёт certbot --nginx (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/school.example.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.example.by/privkey.pem;
    client_max_body_size 10m;

    location /static/ { alias /srv/school-site/current/staticfiles/; expires 30d; }
    location / {
        proxy_pass http://unix:/run/school-site/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
